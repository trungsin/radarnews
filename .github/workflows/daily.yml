name: daily
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: radarnews-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Crawl public sources into D1
        run: node --experimental-strip-types scripts/crawl-once.ts

  leiden:
    needs: crawl
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build leiden-run
        run: cargo build --release --manifest-path crates/leiden-run/Cargo.toml
      - name: Build CSR, run Leiden, write community_id + heat
        run: node --experimental-strip-types scripts/leiden-local.ts

  extract:
    needs: leiden
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Gemini label + insight on hot communities
        run: node --experimental-strip-types scripts/extract-once.ts
